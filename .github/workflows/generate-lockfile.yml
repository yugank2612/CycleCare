name: Generate npm Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-npm-lockfile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile
        run: |
          test -f package-lock.json
          node -e "const l=require('./package-lock.json'); if(l.name !== 'cyclecare' || !l.packages) process.exit(1); console.log('Lockfile generated successfully')"

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "Generate npm package lockfile"
            git push origin HEAD:main
          fi
